# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: Deploy

on:
  workflow_call:
    inputs:
      argocd-appname:
        type: string
        description: Staging ArgoCD application name
        required: true
      argocd-prod-appname:
        type: string
        description: Production ArgoCD application name
        required: true
    secrets:
      argocd-server:
        description: Staging ArgoCD server URI
        required: true
      argocd-username:
        description: Staging ArgoCD deployer username
        required: true
      argocd-password:
        description: Staging ArgoCD deployer password
        required: true
      argocd-prod-server:
        description: Production ArgoCD server URI
        required: true
      argocd-prod-username:
        description: Production ArgoCD deployer username
        required: true
      argocd-prod-password:
        description: Production ArgoCD deployer password
        required: true

jobs:
  deploy_staging:
    name: Staging deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment:
      name: staging
    steps:
      - uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.6.7
          command: login ${{ secrets.argocd-server }}
          options: --password ${{ secrets.argocd-password }} --username ${{ secrets.argocd-username }}
      - uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.6.7
          command: app set argocd/${{ inputs.argocd-appname }}
          options: --parameter image.tag=${{ github.sha }}
  deploy:
    name: Production deployment
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment:
      name: production
    steps:
      - uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.6.7
          command: login ${{ secrets.argocd-prod-server }}
          options: --password ${{ secrets.argocd-prod-password }} --username ${{ secrets.argocd-prod-username }}
      - uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.6.7
          command: app set argocd/${{ inputs.argocd-prod-appname }}
          options: --parameter image.tag=${{ github.sha }}
